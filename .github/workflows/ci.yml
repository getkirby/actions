name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkout:
    name: checkout

    runs-on: &runner ubuntu-24.04
    timeout-minutes: &timeout 5

    steps:
      # the action can only be loaded once the repository is checked out
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout with the action
        uses: ./checkout

      # without the parents, a shallow merge commit has none
      - name: Check the checkout
        run: |
          if git config --get-regexp extraheader; then exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$(git rev-parse HEAD^@ | wc -l)" -eq 2; fi

  apt:
    name: apt

    runs-on: *runner
    # the runner's apt mirror can take minutes
    timeout-minutes: 10

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        uses: ./apt
        with:
          packages: figlet

      - name: Check the packages
        run: figlet Kirby

  php:
    name: php (PHP ${{ matrix.php || 'from composer.json' }}${{ matrix.dependencies != 'locked' && format(', {0} dependencies', matrix.dependencies) || '' }})

    runs-on: *runner
    timeout-minutes: *timeout
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5", "8.6"]
        dependencies: [locked]
        include:
          - php: "8.3"
            dependencies: lowest
          - php: "8.6"
            dependencies: latest
          - php: ""
            dependencies: locked

    steps:
      - *checkout

      # the actions work on the repository root
      - &copy
        name: Copy the test project to the root
        run: cp -R test-project/. .

      - name: Setup PHP
        uses: ./php
        with:
          version: ${{ matrix.php }}
          extensions: mbstring
          dependencies: ${{ matrix.dependencies }}

      - name: Check the environment
        env:
          EXPECTED: ${{ matrix.php || '8.3' }}
        run: |
          php -r 'exit(PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION === getenv("EXPECTED") ? 0 : 1);'
          command -v cpx
          composer show psr/clock

  php-versions:
    name: php-versions

    runs-on: *runner
    timeout-minutes: *timeout

    steps:
      - *checkout

      - *copy

      - name: Find the PHP versions
        id: versions
        uses: ./php-versions

      - name: Check the PHP versions
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
          LOWEST: ${{ steps.versions.outputs.lowest }}
        run: |
          test "$VERSIONS" = '["8.3","8.4","8.5","8.6"]'
          test "$LOWEST" = 8.3

      - name: Allow PHP 8.2 as well
        run: jq '.require.php = "~8.2.0 || " + .require.php' composer.json > composer.tmp && mv composer.tmp composer.json

      - name: Find the PHP versions with PHP 8.2
        id: versions-82
        continue-on-error: true
        uses: ./php-versions

      - name: Check that PHP 8.2 is refused
        if: steps.versions-82.outcome != 'failure'
        run: exit 1

  node-versions:
    name: node-versions

    runs-on: *runner
    timeout-minutes: *timeout

    steps:
      - *checkout

      - *copy

      - name: Find the Node versions
        id: versions
        uses: ./node-versions

      - name: Check the Node versions
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
          LOWEST: ${{ steps.versions.outputs.lowest }}
        run: |
          test "$VERSIONS" = '["22","24","26"]'
          test "$LOWEST" = 22

  outdated:
    name: kirby-actions outdated

    runs-on: *runner
    timeout-minutes: *timeout

    steps:
      - *checkout

      # with composer/semver from the root composer.json
      - name: Setup PHP
        uses: ./php

      - name: Update the tools of the test project
        working-directory: test-project
        run: ../bin/kirby-actions outdated --update

      # afterwards, only new majors may be left
      - name: Check the tools of the test project
        working-directory: test-project
        run: |
          ../bin/kirby-actions outdated | tee "$RUNNER_TEMP/outdated.txt"
          grep -q "vimeo/psalm" "$RUNNER_TEMP/outdated.txt"
          if grep -E "→ [0-9.]+($|,)" "$RUNNER_TEMP/outdated.txt"; then exit 1; fi

  node:
    name: node (Node ${{ matrix.version || 'from package.json' }}${{ matrix.directory != '.' && format(' in {0}/', matrix.directory) || '' }})

    runs-on: *runner
    timeout-minutes: *timeout
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: .
            version: ""
          - directory: panel
            version: "24"

    steps:
      - *checkout

      - name: Copy the test project
        run: mkdir -p "${{ matrix.directory }}" && cp -R test-project/. "${{ matrix.directory }}"

      - name: Setup Node
        uses: ./node
        with:
          version: ${{ matrix.version }}
          working-directory: ${{ matrix.directory }}

      - name: Check the environment
        working-directory: ${{ matrix.directory }}
        env:
          EXPECTED: ${{ matrix.version || '22' }}
        run: |
          node -e 'process.exit(process.versions.node.split(".")[0] === process.env.EXPECTED ? 0 : 1)'
          npm ls picocolors

  phpunit:
    name: phpunit (PHP ${{ matrix.php }}${{ matrix.coverage != 'none' && ' with coverage' || '' }})

    runs-on: *runner
    timeout-minutes: *timeout
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            coverage: none
          - php: "8.5"
            coverage: pcov
          - php: "8.6"
            coverage: none

    steps:
      - *checkout

      - *copy

      - name: Setup PHP
        uses: ./php
        with:
          version: ${{ matrix.php }}
          extensions: mbstring
          coverage: ${{ matrix.coverage }}

      - name: Run PHP unit tests
        uses: ./phpunit
        with:
          args: --display-skipped

      - name: Check the coverage report
        if: matrix.coverage == 'pcov'
        run: test -s "$RUNNER_TEMP/clover.xml"

  vitest:
    name: vitest

    runs-on: *runner
    timeout-minutes: *timeout

    steps:
      - *checkout

      - *copy

      - name: Setup Node
        uses: ./node

      - name: Run JavaScript unit tests
        uses: ./vitest

      - name: Check the coverage report
        run: test -s "$RUNNER_TEMP/coverage/clover.xml"

  analysis:
    name: composer, psalm, php-cs

    runs-on: *runner
    timeout-minutes: *timeout
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - *checkout

      - *copy

      - name: Setup PHP
        uses: ./php
        with:
          version: "8.3"
          extensions: mbstring
          tools: composer-normalize:2.54.0

      - name: Check Composer
        uses: ./composer

      - name: Analyze PHP
        uses: ./psalm
        with:
          # code scanning isn't available for private repositories
          sarif: ${{ !github.event.repository.private }}

      - name: Check PHP code style
        uses: ./php-cs
        with:
          suggestions: true

  node-workflow:
    name: node.yml
    uses: ./.github/workflows/node.yml
    with:
      working-directory: test-project
